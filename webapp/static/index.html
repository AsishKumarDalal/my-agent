<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>my-agent</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <button class="new-chat" id="new-chat">
      <span class="plus">+</span> New chat
    </button>
    <div class="section-label">Sessions</div>
    <div class="session-list" id="session-list"></div>
    <div class="sidebar-footer">
      <span class="dot"></span> my-agent harness &middot; local
    </div>
  </aside>

  <main class="chat">
    <header class="chat-header">
      <button class="icon-btn" id="toggle-sidebar" title="Toggle sidebar">☰</button>
      <div class="chat-title" id="chat-title">New chat</div>
      <div class="chat-model">harness &middot; ReAct &middot; SQLite memory</div>
    </header>

    <div class="messages" id="messages">
      <div class="welcome" id="welcome">
        <div class="welcome-logo">⌘</div>
        <h1>What can I help you build?</h1>
        <div class="suggestions">
          <button class="suggestion" data-prompt="Summarize what this project does by reading the files.">Explore this repo</button>
          <button class="suggestion" data-prompt="Search my past sessions for anything about opencode and summarize what we found.">Recall past sessions</button>
          <button class="suggestion" data-prompt="What do you remember about me and my projects?">Show what you remember</button>
          <button class="suggestion" data-prompt="Create a todo list for adding unit tests to the agent package, then start on the first item.">Plan a task</button>
        </div>
      </div>
    </div>

    <div class="composer-wrap">
      <div class="composer">
        <textarea id="input" rows="1" placeholder="Message the agent…"
                  autocomplete="off"></textarea>
        <button id="send" title="Send" disabled>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M12 20V5M5 12l7-7 7 7" stroke="currentColor"
                  stroke-width="2.2" stroke-linecap="round"
                  stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
      <div class="composer-hint">Enter to send &middot; Shift+Enter for a new line</div>
    </div>
  </main>
</div>
<script src="/static/app.js"></script>
</body>
</html>
